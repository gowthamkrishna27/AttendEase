            "name": "How do students apply for duty-leave / permissions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Students can log in to the Student Portal, click 'New Permission Request', select their date, time slot/periods, reason category, and upload proof documents. Once submitted, it forwards to their assigned Faculty Advisor."

          },
          {
            "@type": "Question",
            "name": "How does Faculty mark attendance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Faculty members log in, select the Year and Target Section (e.g. CSIT-B), select the specific period (P1 to P8), and tap student roll numbers to mark Present/Absent. Approved permissions automatically highlight in yellow."
            }
          },
          {
            "@type": "Question",
            "name": "What is the HOD Direct Exemption feature?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HODs can grant bulk attendance exemptions to multiple students directly for academic events, hackathons, sports, or official college duties without requiring individual student submissions."
            }
          },
          {
            "@type": "Question",
            "name": "How can I export attendance to WhatsApp?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On the Public Permissions & Attendance page, tap 'Share to WhatsApp' or 'WhatsApp Report' to automatically format sorted presentees and absentees lists with Date and Time, ready to paste directly into official WhatsApp groups."

          }
